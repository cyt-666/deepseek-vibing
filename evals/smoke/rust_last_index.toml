id = "rust_last_index"
title = "Fix an index boundary condition"
tags = ["rust", "boundary"]
prompt = "Correct the boundary behavior for this helper. Do not change the function name or return type."

[[files]]
path = "Cargo.toml"
content = """
[package]
name = "eval_rust_last_index"
version = "0.1.0"
edition = "2021"
"""

[[files]]
path = "src/lib.rs"
content = """
pub fn last_index(len: usize) -> Option<usize> {
    Some(len)
}

#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn returns_none_for_empty_lengths() {
        assert_eq!(last_index(0), None);
    }

    #[test]
    fn returns_last_valid_index() {
        assert_eq!(last_index(1), Some(0));
        assert_eq!(last_index(5), Some(4));
    }
}
"""

[verify]
command = ["cargo", "test", "--quiet"]
