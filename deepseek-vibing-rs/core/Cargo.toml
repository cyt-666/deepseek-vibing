[package]
edition.workspace = true
license.workspace = true
name = "deepseek-vibing-core"
version.workspace = true

[lib]
name = "deepseek_vibing_core"
path = "src/lib.rs"

[[bin]]
name = "deepseek-vibing-write-config-schema"
path = "src/bin/config_schema.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bm25 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
deepseek-vibing-analytics = { workspace = true }
deepseek-vibing-api = { workspace = true }
deepseek-vibing-app-server-protocol = { workspace = true }
deepseek-vibing-apply-patch = { workspace = true }
deepseek-vibing-async-utils = { workspace = true }
deepseek-vibing-connectors = { workspace = true }
deepseek-vibing-config = { workspace = true }
deepseek-vibing-core-plugins = { workspace = true }
deepseek-vibing-core-skills = { workspace = true }
deepseek-vibing-exec-server = { workspace = true }
deepseek-vibing-extension-api = { workspace = true }
deepseek-vibing-features = { workspace = true }
deepseek-vibing-feedback = { workspace = true }
deepseek-vibing-auth = { workspace = true }
deepseek-vibing-memories-read = { workspace = true }
deepseek-vibing-mcp = { workspace = true }
deepseek-vibing-model-provider-info = { workspace = true }
deepseek-vibing-models-manager = { workspace = true }
deepseek-vibing-shell-command = { workspace = true }
deepseek-vibing-execpolicy = { workspace = true }
deepseek-vibing-git-utils = { workspace = true }
deepseek-vibing-hooks = { workspace = true }
deepseek-vibing-install-context = { workspace = true }
deepseek-vibing-network-proxy = { workspace = true }
deepseek-vibing-otel = { workspace = true }
deepseek-vibing-plugin = { workspace = true }
deepseek-vibing-model-provider = { workspace = true }
deepseek-vibing-protocol = { workspace = true }
deepseek-vibing-response-debug-context = { workspace = true }
deepseek-vibing-prompts = { workspace = true }
deepseek-vibing-rollout = { workspace = true }
deepseek-vibing-rollout-trace = { workspace = true }
deepseek-vibing-rmcp-client = { workspace = true }
deepseek-vibing-sandboxing = { workspace = true }
deepseek-vibing-state = { workspace = true }
deepseek-vibing-terminal-detection = { workspace = true }
deepseek-vibing-thread-store = { workspace = true }
deepseek-vibing-tools = { workspace = true }
deepseek-vibing-utils-absolute-path = { workspace = true }
deepseek-vibing-utils-cache = { workspace = true }
deepseek-vibing-utils-image = { workspace = true }
deepseek-vibing-utils-home-dir = { workspace = true }
deepseek-vibing-utils-output-truncation = { workspace = true }
deepseek-vibing-utils-path = { workspace = true }
deepseek-vibing-utils-plugins = { workspace = true }
deepseek-vibing-utils-pty = { workspace = true }
deepseek-vibing-utils-string = { workspace = true }
deepseek-vibing-utils-stream-parser = { workspace = true }
deepseek-vibing-windows-sandbox = { package = "deepseek-vibing-windows-sandbox", path = "../windows-sandbox-rs" }
csv = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
iana-time-zone = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
indexmap = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
regex-lite = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v5"] }
which = { workspace = true }
whoami = { workspace = true }
wildmatch = { workspace = true }

# Build OpenSSL from source for musl builds.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

# Build OpenSSL from source for musl builds.
[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[target.'cfg(unix)'.dependencies]
deepseek-vibing-shell-escalation = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
deepseek-vibing-otel = { workspace = true }
deepseek-vibing-test-binary-support = { workspace = true }
deepseek-vibing-utils-cargo-bin = { workspace = true }
core_test_support = { workspace = true }
ctor = { workspace = true }
insta = { workspace = true }
maplit = { workspace = true }
opentelemetry = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
test-case = "3.3.1"
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
] }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
walkdir = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
