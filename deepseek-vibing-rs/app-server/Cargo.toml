[package]
name = "deepseek-vibing-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "deepseek-vibing-app-server"
path = "src/main.rs"

[[bin]]
name = "deepseek-vibing-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[lib]
name = "deepseek_vibing_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
deepseek-vibing-analytics = { workspace = true }
deepseek-vibing-arg0 = { workspace = true }
deepseek-vibing-cloud-config = { workspace = true }
deepseek-vibing-config = { workspace = true }
deepseek-vibing-core = { workspace = true }
deepseek-vibing-core-plugins = { workspace = true }
deepseek-vibing-exec-server = { workspace = true }
deepseek-vibing-extension-api = { workspace = true }
deepseek-vibing-external-agent-migration = { workspace = true }
deepseek-vibing-external-agent-sessions = { workspace = true }
deepseek-vibing-features = { workspace = true }
deepseek-vibing-guardian = { workspace = true }
deepseek-vibing-git-utils = { workspace = true }
deepseek-vibing-file-watcher = { workspace = true }
deepseek-vibing-hooks = { workspace = true }
deepseek-vibing-otel = { workspace = true }
deepseek-vibing-plugin = { workspace = true }
deepseek-vibing-shell-command = { workspace = true }
deepseek-vibing-utils-cli = { workspace = true }
deepseek-vibing-utils-pty = { workspace = true }
deepseek-vibing-file-search = { workspace = true }
deepseek-vibing-auth = { workspace = true }
deepseek-vibing-memories-extension = { workspace = true }
deepseek-vibing-memories-write = { workspace = true }
deepseek-vibing-mcp = { workspace = true }
deepseek-vibing-model-provider = { workspace = true }
deepseek-vibing-models-manager = { workspace = true }
deepseek-vibing-protocol = { workspace = true }
deepseek-vibing-app-server-protocol = { workspace = true }
deepseek-vibing-app-server-transport = { workspace = true }
deepseek-vibing-feedback = { workspace = true }
deepseek-vibing-rmcp-client = { workspace = true }
deepseek-vibing-rollout = { workspace = true }
deepseek-vibing-sandboxing = { workspace = true }
deepseek-vibing-state = { workspace = true }
deepseek-vibing-thread-store = { workspace = true }
deepseek-vibing-tools = { workspace = true }
deepseek-vibing-utils-absolute-path = { workspace = true }
deepseek-vibing-utils-json-to-toml = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
uuid = { workspace = true, features = ["serde", "v7"] }

[target.'cfg(windows)'.dependencies]
deepseek-vibing-windows-sandbox = { workspace = true }

[dev-dependencies]
app_test_support = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
