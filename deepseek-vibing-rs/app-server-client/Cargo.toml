[package]
name = "deepseek-vibing-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "deepseek_vibing_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
deepseek-vibing-app-server = { workspace = true }
deepseek-vibing-app-server-protocol = { workspace = true }
deepseek-vibing-arg0 = { workspace = true }
deepseek-vibing-config = { workspace = true }
deepseek-vibing-core = { workspace = true }
deepseek-vibing-exec-server = { workspace = true }
deepseek-vibing-feedback = { workspace = true }
deepseek-vibing-protocol = { workspace = true }
deepseek-vibing-uds = { workspace = true }
deepseek-vibing-utils-absolute-path = { workspace = true }
deepseek-vibing-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
