[package]
edition.workspace = true
license.workspace = true
name = "deepseek-vibing-models-manager"
version.workspace = true

[lib]
doctest = false
name = "deepseek_vibing_models_manager"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
deepseek-vibing-app-server-protocol = { workspace = true }
deepseek-vibing-collaboration-mode-templates = { workspace = true }
deepseek-vibing-auth = { workspace = true }
deepseek-vibing-otel = { workspace = true }
deepseek-vibing-protocol = { workspace = true }
deepseek-vibing-utils-output-truncation = { workspace = true }
deepseek-vibing-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
