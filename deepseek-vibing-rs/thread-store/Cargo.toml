[package]
edition.workspace = true
license.workspace = true
name = "deepseek-vibing-thread-store"
version.workspace = true

[lib]
name = "deepseek_vibing_thread_store"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
deepseek-vibing-git-utils = { workspace = true }
deepseek-vibing-install-context = { workspace = true }
deepseek-vibing-protocol = { workspace = true }
deepseek-vibing-rollout = { workspace = true }
deepseek-vibing-state = { workspace = true }
deepseek-vibing-utils-path = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
