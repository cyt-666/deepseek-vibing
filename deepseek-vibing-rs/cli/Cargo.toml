[package]
name = "deepseek-vibing-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "deepseek-vibing"
path = "src/main.rs"

[lib]
name = "deepseek_vibing_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
deepseek-vibing-app-server = { workspace = true }
deepseek-vibing-app-server-daemon = { workspace = true }
deepseek-vibing-app-server-protocol = { workspace = true }
deepseek-vibing-app-server-test-client = { workspace = true }
deepseek-vibing-arg0 = { workspace = true }
deepseek-vibing-api = { workspace = true }
deepseek-vibing-utils-cli = { workspace = true }
deepseek-vibing-config = { workspace = true }
deepseek-vibing-core = { workspace = true }
deepseek-vibing-core-plugins = { workspace = true }
deepseek-vibing-exec = { workspace = true }
deepseek-vibing-exec-server = { workspace = true }
deepseek-vibing-execpolicy = { workspace = true }
deepseek-vibing-features = { workspace = true }
deepseek-vibing-git-utils = { workspace = true }
deepseek-vibing-install-context = { workspace = true }
deepseek-vibing-auth = { workspace = true }
deepseek-vibing-memories-write = { workspace = true }
deepseek-vibing-mcp = { workspace = true }
deepseek-vibing-mcp-server = { workspace = true }
deepseek-vibing-model-provider = { workspace = true }
deepseek-vibing-models-manager = { workspace = true }
deepseek-vibing-plugin = { workspace = true }
deepseek-vibing-protocol = { workspace = true }
deepseek-vibing-rmcp-client = { workspace = true }
deepseek-vibing-rollout = { workspace = true }
deepseek-vibing-rollout-trace = { workspace = true }
deepseek-vibing-sandboxing = { workspace = true }
deepseek-vibing-state = { workspace = true }
deepseek-vibing-stdio-to-uds = { workspace = true }
deepseek-vibing-terminal-detection = { workspace = true }
deepseek-vibing-tui = { workspace = true }
deepseek-vibing-utils-absolute-path = { workspace = true }
deepseek-vibing-utils-path = { workspace = true }
crossterm = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
deepseek_vibing_windows_sandbox = { package = "deepseek-vibing-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
deepseek-vibing-utils-cargo-bin = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
