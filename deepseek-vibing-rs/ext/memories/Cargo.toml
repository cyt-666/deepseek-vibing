[package]
edition.workspace = true
license.workspace = true
name = "deepseek-vibing-memories-extension"
version.workspace = true

[lib]
name = "deepseek_vibing_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
deepseek-vibing-core = { workspace = true }
deepseek-vibing-extension-api = { workspace = true }
deepseek-vibing-features = { workspace = true }
deepseek-vibing-otel = { workspace = true }
deepseek-vibing-tools = { workspace = true }
deepseek-vibing-utils-absolute-path = { workspace = true }
deepseek-vibing-utils-output-truncation = { workspace = true }
deepseek-vibing-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
