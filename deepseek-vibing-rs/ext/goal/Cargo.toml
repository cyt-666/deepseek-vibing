[package]
edition.workspace = true
license.workspace = true
name = "deepseek-vibing-goal-extension"
version.workspace = true

[lib]
name = "deepseek_vibing_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
deepseek-vibing-core = { workspace = true }
deepseek-vibing-extension-api = { workspace = true }
deepseek-vibing-otel = { workspace = true }
deepseek-vibing-protocol = { workspace = true }
deepseek-vibing-state = { workspace = true }
deepseek-vibing-tools = { workspace = true }
deepseek-vibing-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
